<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="YouTube" />
  <title>YouTube – CarPlay</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --red: #FF0000;
      --red-dim: #CC0000;
      --bg: #0A0A0A;
      --surface: #141414;
      --border: #2A2A2A;
      --text: #F5F5F5;
      --muted: #888;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Layout ── */
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      gap: 0;
      padding: 32px 24px;
      position: relative;
    }

    /* ── Ambient glow ── */
    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 56%, rgba(255,0,0,0.12) 0%, transparent 70%);
      pointer-events: none;
      animation: breathe 3.6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1; }
    }

    /* ── Logo mark ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 52px;
      z-index: 1;
    }

    .yt-icon {
      width: 52px;
      height: 37px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    /* ── Main button ── */
    .launch-btn {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: min(380px, 100%);
      height: 100px;
      background: var(--red);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      box-shadow: 0 0 0 0 rgba(255,0,0,0.5);
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
      -webkit-touch-callout: none;
    }

    .launch-btn:active {
      background: var(--red-dim);
      transform: scale(0.97);
      box-shadow: 0 0 32px rgba(255,0,0,0.4);
    }

    .launch-btn .btn-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    /* ── Status / hint ── */
    .hint {
      z-index: 1;
      margin-top: 28px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      max-width: 300px;
    }

    /* ── Quick links ── */
    .quick-links {
      z-index: 1;
      display: flex;
      gap: 12px;
      margin-top: 36px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .quick-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.12s;
      -webkit-touch-callout: none;
    }

    .quick-link:active {
      background: #222;
      transform: scale(0.96);
    }

    .quick-link svg {
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .footer {
      position: absolute;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: #444;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="glow"></div>

    <!-- Logo -->
    <div class="logo-wrap">
      <svg class="yt-icon" viewBox="0 0 90 63" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="90" height="63" rx="14" fill="#FF0000"/>
        <path d="M37 20L60 31.5L37 43V20Z" fill="white"/>
      </svg>
      <span class="logo-text">YouTube</span>
    </div>

    <!-- Main CTA -->
    <a class="launch-btn" href="youtube://" id="launchBtn" onclick="handleLaunch(event)">
      <svg class="btn-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="15" stroke="white" stroke-width="2"/>
        <path d="M13 10.5L22 16L13 21.5V10.5Z" fill="white"/>
      </svg>
      Open YouTube
    </a>

    <!-- Hint -->
    <p class="hint" id="hint">Tap to launch the YouTube app on your iPhone.</p>

    <!-- Quick links -->
    <div class="quick-links">
      <a class="quick-link" href="youtube://trending" onclick="handleDeepLink(event, 'youtube://trending', 'https://m.youtube.com/feed/trending')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 17l4-8 4 5 3-3 4 6H3z" fill="#FF0000"/><path d="M21 7l-3 3-3-3" stroke="#888" stroke-width="1.5" stroke-linecap="round"/></svg>
        Trending
      </a>
      <a class="quick-link" href="youtube://subscriptions" onclick="handleDeepLink(event, 'youtube://subscriptions', 'https://m.youtube.com/feed/subscriptions')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="2" stroke="#888" stroke-width="1.5"/><path d="M9 7V5a3 3 0 016 0v2" stroke="#888" stroke-width="1.5" stroke-linecap="round"/></svg>
        Subscriptions
      </a>
      <a class="quick-link" href="youtube://search" onclick="handleDeepLink(event, 'youtube://search', 'https://m.youtube.com/results')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#888" stroke-width="1.5"/><path d="M20 20l-3-3" stroke="#888" stroke-width="1.5" stroke-linecap="round"/></svg>
        Search
      </a>
    </div>

    <p class="footer">Add to Home Screen for fastest CarPlay access</p>
  </div>

  <script>
    // Try YouTube app URL scheme; fall back to mobile web
    function handleLaunch(e) {
      e.preventDefault();
      const appUrl   = 'youtube://';
      const webUrl   = 'https://m.youtube.com/';
      tryOpen(appUrl, webUrl);
    }

    function handleDeepLink(e, appUrl, webUrl) {
      e.preventDefault();
      tryOpen(appUrl, webUrl);
    }

    function tryOpen(appUrl, fallback) {
      const hint = document.getElementById('hint');

      // Attempt the custom URL scheme
      const start = Date.now();
      window.location = appUrl;

      // If the app didn't open (no scheme handler), fall back to mobile web
      setTimeout(() => {
        if (Date.now() - start < 1800) {
          // App didn't take over — redirect to mobile YouTube
          window.location = fallback;
          if (hint) hint.textContent = 'Opening YouTube in Safari…';
        }
      }, 1500);

      if (hint) hint.textContent = 'Opening YouTube…';

      // Reset hint after a moment
      setTimeout(() => {
        if (hint) hint.textContent = 'Tap to launch the YouTube app on your iPhone.';
      }, 4000);
    }
  </script>
</body>
</html>
